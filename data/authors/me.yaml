bio: |
  <p>Currently a Research Intern in the Siemens Digital Manufacturing Technologies Research Group,
  I work on Geometric Deep Learning and 3D Vision, developing self-supervised architectures to
  understand complex industrial 3D models.</p>

  <p>Currently working on Computational Manufacturing: using geometric deep learning to understand the shape of
  3D CAD parts, especially B-Reps, and turn target geometry into the manufacturing operations needed
  to produce it.</p>

  <p>I'm a student at <a href="https://www.telecom-paris.fr/">Télécom Paris</a>, one of France's top
  engineering schools, where I'm pursuing an engineering degree in Applied Mathematics, Signal
  Processing &amp; Artificial Intelligence. I am also currently enrolled in the
  <a href="https://www.masteriasd.eu/en/">Master IASD</a> (Artificial Intelligence, Systems, Data,
  Math Track), a research-oriented master in AI between ENS Paris, Mines Paris, and Université
  Paris-Dauphine within PSL Research University.</p>

  <p class="ri-label">Research interests</p>
  <p class="ri-wrap">
    <a href="#featured-projects" class="ri-chip ri-amber">Self-supervised Learning</a>
    <a href="#featured-projects" class="ri-chip ri-rose">3D Vision</a>
    <a href="#featured-projects" class="ri-chip ri-violet">World Modelling</a>
    <a href="#featured-projects" class="ri-chip ri-blue">Multimodal Learning</a>
    <a href="#featured-projects" class="ri-chip ri-cyan">Egocentric Vision</a>
    <a href="#featured-projects" class="ri-chip ri-emerald">Action Recognition</a>
    <a href="#featured-projects" class="ri-chip ri-teal">Video Understanding</a>
  </p>

