    Experience:
      - company: Siemens AG — Foundational Technologies
        position: AI Research Intern
        location: Munich, Germany
        start_date: 2026
        end_date: present
        summary: Research in Geometric Deep Learning and 3D Vision within the Digital Manufacturing Technologies Research Group — designing a self-supervised representation-learning framework for 3D CAD (BRep) models based on a Joint-Embedding Predictive Architecture (JEPA).
        highlights:
          - "Built a geometry encoder over a geometric Attributed Adjacency Graph, coupling Cross-Scale Mutual Attention with edge-aware Message Passing (Graph Transformer); benchmarked an enhanced Point Transformer v3 (Utonia) as an alternative encoder."
          - "Reached **86.1% face accuracy on MFInstSeg with 0.1% of labels** (44 parts), +33.6 points over a matched from-scratch control — on par with the best published results while using a 4.8× smaller encoder and an order of magnitude less pretraining data."
          - "Ran an instrumented ablation isolating what latent prediction can and cannot force."
          - "Engineered a geometry-driven module auto-generating PMI (GD&T tolerances & datums) from CAD geometry to automate CMM inspection planning."
          - "Owned the pipeline end to end — raw CAD data processing, pretraining runs, evaluation protocol, and few-shot / frozen-probe downstream benchmarks (machining-feature recognition, part segmentation & classification)."

