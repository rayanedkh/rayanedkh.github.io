    Experience:
      - company: Siemens AG — Foundational Technologies
        position: AI Research Intern
        location: Munich, Germany
        start_date: 2026
        end_date: 2026
        summary: Designing a novel self-supervised representation learning framework for 3D CAD (Boundary-Representation) models, built on a Joint-Embedding Predictive Architecture (JEPA).
        highlights:
          - Built a geometry encoder over a geometric Attributed Adjacency Graph, coupling Cross-Scale Mutual Attention with edge-aware Message Passing (Graph Transformer); benchmarked an enhanced Point Transformer v3 point-cloud backbone (Utonia) as an alternative encoder.
          - Ran an instrumented study isolating what a latent-prediction objective can and cannot force; frozen linear-probe transfer reached 0.71 accuracy (+0.38 over a matched random-init control) in the label-scarce regime (<0.5% labels).
          - Engineered a geometry-driven module auto-generating PMI (GD&T tolerances & datums) from CAD geometry to automate CMM inspection planning.
          - Designed the pretraining for few-shot transfer across downstream tasks — automated machining-feature recognition (CAM), part segmentation & classification.

